name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database (migrations + pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      # config.toml enables the Send SMS hook, whose secret must exist for the CLI to load.
      # Generate a throwaway one per run; the real secret only lives in the hosted project.
      - name: Create throwaway local hook secret
        run: echo "SEND_SMS_HOOK_SECRET=v1,whsec_$(openssl rand -base64 32)" > supabase/.env

      - name: Start local database and apply all migrations
        run: supabase db start

      - name: Run database tests
        run: supabase test db

  functions:
    name: Edge Functions (Deno tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: send-sms hook tests
        working-directory: supabase/functions/send-sms
        run: deno test

      - name: places function tests
        working-directory: supabase/functions/places
        run: deno test

      - name: quote-order function tests (and the shared Google client)
        working-directory: supabase/functions/quote-order
        run: deno test

      - name: type-check function entry points
        run: |
          deno check --config supabase/functions/places/deno.json supabase/functions/places/index.ts
          deno check --config supabase/functions/quote-order/deno.json supabase/functions/quote-order/index.ts

  app:
    name: App (typecheck + unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
